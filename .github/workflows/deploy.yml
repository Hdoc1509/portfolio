name: Deploy portfolio

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  changed-files:
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.filter.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: tj-actions/changed-files@v47.0.1
        id: filter
        with:
          files: |
            .github/workflows/deploy.yml
            src/
            public/
            astro.config.mjs
            package.json
            .nvmrc

  lint:
    needs: changed-files
    runs-on: ubuntu-22.04
    if: needs.changed-files.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v6.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install
      - run: pnpm run lint

  build:
    needs: [lint, changed-files]
    runs-on: ubuntu-22.04
    if: needs.changed-files.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v6.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4.0.5
        id: deployment
